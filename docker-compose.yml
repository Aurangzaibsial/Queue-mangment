version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: booking_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: booking_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - booking_network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: booking_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - booking_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Python ML service with the trained queue wait-time model
  ai-service:
    build:
      context: .
      dockerfile: python-ai-service/Dockerfile
    container_name: booking_ai_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    networks:
      - booking_network
    restart: unless-stopped

  # Node.js API Service (with Gemini AI Integration)
  api-service:
    build:
      context: ./smart-queue-backend
      dockerfile: Dockerfile
    container_name: booking_api_service
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/booking_db
      - REDIS_URI=redis://redis:6379/0
      - JWT_SECRET=your-jwt-secret-change-in-production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHON_AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - redis
      - ai-service
    networks:
      - booking_network
    restart: unless-stopped
    volumes:
      - ./smart-queue-backend:/app
      - /app/node_modules

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: booking_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-service
    networks:
      - booking_network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: booking_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - booking_network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: booking_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - booking_network
    restart: unless-stopped

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  booking_network:
    driver: bridge
